name: Scheduled Deploy

on:
  schedule:
    - cron: '0 11 * * 2'  # 4am PST every Tuesday
    - cron: '0 11 * * 5'  # 4am PST every Friday
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}